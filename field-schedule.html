<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk:#F3EFE4; --grass:#2E6B3F; --grass-dk:#1F4D2E; --dirt:#C0713A;
    --ink:#1B1F1A; --mute:#7A7F76; --line:#DCD6C6; --card:#FFFDF8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--chalk);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input{font:inherit}

  header{background:var(--grass-dk);color:var(--chalk);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
  .eyebrow{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.75;display:flex;justify-content:space-between;align-items:center}
  .status{font-size:10px;letter-spacing:.05em;text-transform:none;opacity:.8}
  .status.err{color:#F3B8A8}
  .monthrow{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .month{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
  .nav{display:flex;gap:6px}
  .nav button{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.12);font-size:20px;line-height:1}
  .nav button:active{background:rgba(255,255,255,.25)}
  .today-btn{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:0 10px;width:auto!important}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px 6px 120px}
  .dow{text-align:center;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:4px 0 6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:82px;padding:4px 3px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
  .day.pad{background:transparent;border-color:transparent}
  .day:active{background:#F7F1E2}
  .day .num{font-family:Oswald,sans-serif;font-size:13px;font-weight:500;color:var(--mute);line-height:1}
  .day.today .num{color:#fff;background:var(--dirt);border-radius:999px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  .day.has{border-color:var(--grass)}
  .chip{font-size:10px;font-weight:600;line-height:1.15;padding:2px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{font-size:10px;color:var(--mute);font-weight:600}
  .day.weekend{background:#FBF8F0}

  /* bottom sheet */
  .scrim{position:fixed;inset:0;background:rgba(27,31,26,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:10;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .sheet.open{transform:translateY(0)}
  .handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 6px}
  .sheet-head{padding:4px 18px 10px;border-bottom:2px solid var(--grass);display:flex;align-items:baseline;justify-content:space-between}
  .sheet-title{font-family:Oswald,sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
  .sheet-sub{font-size:12px;color:var(--mute)}
  .close{font-size:22px;color:var(--mute);padding:4px 6px}
  .sheet-body{overflow:auto;padding:12px 18px 24px}

  .lineup{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .lineup li{display:flex;align-items:center;gap:10px;background:var(--chalk);border-radius:8px;padding:9px 10px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .lineup .who{font-weight:600;flex:1;min-width:0}
  .lineup .who small{display:block;font-weight:400;color:var(--mute);font-size:12px}
  .del{color:var(--mute);font-size:20px;padding:0 4px;line-height:1}
  .empty{color:var(--mute);font-size:14px;padding:6px 0 14px}

  .label{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 6px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .quick button{padding:7px 12px;border-radius:999px;color:#fff;font-weight:600;font-size:13px}
  .quick button:active{filter:brightness(.85)}
  .quick .x{background:none;color:var(--mute);font-weight:500;padding:7px 4px;font-size:12px}

  .form{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:stretch}
  .form input{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;font-size:15px;min-width:0}
  .form input:focus{outline:2px solid var(--grass);outline-offset:0;border-color:var(--grass)}
  .form .note{grid-column:1 / -1}
  .add{grid-column:1 / -1;background:var(--grass);color:#fff;border-radius:8px;padding:12px;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:15px;font-weight:700}
  .add:active{background:var(--grass-dk)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--chalk);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="eyebrow">
    <span>Who's on the field</span>
    <span class="status" id="status">connecting…</span>
  </div>
  <div class="monthrow">
    <div class="month" id="monthLabel">—</div>
    <div class="nav">
      <button class="today-btn" id="todayBtn">Today</button>
      <button id="prev" aria-label="Previous month">‹</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
  </div>
</header>

<div class="grid" id="grid"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="handle"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="sheetTitle">—</div>
      <div class="sheet-sub" id="sheetSub"></div>
    </div>
    <button class="close" id="closeBtn" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body">
    <div class="label">On the field</div>
    <ul class="lineup" id="lineup"></ul>
    <div class="empty" id="emptyMsg">Nobody scheduled yet. Tap a name below or add someone.</div>

    <div class="label" id="quickLabel">Tap to add</div>
    <div class="quick" id="quick"></div>

    <div class="form">
      <input id="nameIn" placeholder="Name" autocomplete="off" autocapitalize="words">
      <input id="timeIn" placeholder="Time" autocomplete="off">
      <input id="noteIn" class="note" placeholder="Note (optional) — e.g. hitting clinic, cage 2" autocomplete="off">
      <button class="add" id="addBtn">Add to this day</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- ===================== FIREBASE SETUP =====================
1. Go to https://console.firebase.google.com, create a free project.
2. In the project, add a "Web app" (</> icon) — it gives you a firebaseConfig
   object. Paste your real values into FIREBASE_CONFIG below.
3. Build > Realtime Database > Create Database > start in test mode
   (fine for a small trusted group; lock it down later if you want).
4. That's it — this page reads/writes to that database in real time.
=========================================================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // ---- REPLACE with your project's config (Firebase console > Project settings) ----
 // Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBfp251mIc03Ah6jWNXh7V8Kn5kt4HbkTQ",
  authDomain: "csuf-field-schedule.firebaseapp.com",
  databaseURL: "https://csuf-field-schedule-default-rtdb.firebaseio.com",
  projectId: "csuf-field-schedule",
  storageBucket: "csuf-field-schedule.firebasestorage.app",
  messagingSenderId: "440922836237",
  appId: "1:440922836237:web:fb4e32c96f265a80a5b444",
  measurementId: "G-65QYL3E2XP"
};
  // -----------------------------------------------------------------------------------

  const app = initializeApp(FIREBASE_CONFIG);
  const db = getDatabase(app);
  const scheduleRef = ref(db, "field-schedule");

  let state = { entries: {}, people: [] };
  let view = new Date(); view.setDate(1);
  let selected = null;
  const $ = id => document.getElementById(id);
  const setStatus = (text, isErr) => { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!isErr); };

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const todayKey = iso(new Date());
  const COLORS = ['#2E6B3F','#C0713A','#3B5BA5','#8A3B6B','#B8860B','#2A8C8C','#A33A3A','#5C6B2E','#6B4E9B','#B05A3C'];

  // Live sync: whenever anyone changes the schedule, everyone's page updates automatically.
  let firstLoad = true;
  onValue(scheduleRef, (snapshot) => {
    const val = snapshot.val();
    state = val ? val : { entries: {}, people: [] };
    state.entries = state.entries || {};
    state.people = state.people || [];
    render();
    if (selected) renderSheet();
    setStatus(firstLoad ? 'synced' : 'updated', false);
    firstLoad = false;
  }, (err) => {
    console.error(err);
    setStatus('offline — check connection', true);
  });

  async function save() {
    try { await set(scheduleRef, state); }
    catch (e) { console.error(e); toast('Could not save — check connection'); setStatus('save failed', true); }
  }

  function colorFor(name){
    const i = state.people.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
    if (i >= 0) return state.people[i].color;
    return COLORS[state.people.length % COLORS.length];
  }
  function ensurePerson(name){
    if (!state.people.some(p => p.name.toLowerCase() === name.toLowerCase()))
      state.people.push({ name, color: COLORS[state.people.length % COLORS.length] });
  }

  function render(){
    $('monthLabel').textContent = MONTHS[view.getMonth()]+' '+view.getFullYear();
    const g = $('grid'); g.innerHTML = '';
    DOW.forEach(d => { const el = document.createElement('div'); el.className='dow'; el.textContent=d; g.appendChild(el); });
    const first = new Date(view.getFullYear(), view.getMonth(), 1);
    const days = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    for (let i=0;i<first.getDay();i++){ const p=document.createElement('div'); p.className='day pad'; g.appendChild(p); }
    for (let d=1;d<=days;d++){
      const date = new Date(view.getFullYear(), view.getMonth(), d);
      const k = iso(date);
      const list = state.entries[k] || [];
      const b = document.createElement('button');
      b.className = 'day'+(k===todayKey?' today':'')+(list.length?' has':'')+((date.getDay()===0||date.getDay()===6)?' weekend':'');
      b.setAttribute('aria-label', MONTHS[date.getMonth()]+' '+d);
      b.innerHTML = '<span class="num">'+d+'</span>';
      list.slice(0,3).forEach(e => {
        const c = document.createElement('span'); c.className='chip'; c.style.background=colorFor(e.name);
        c.textContent = (e.time?e.time+' ':'')+e.name.split(' ')[0]; b.appendChild(c);
      });
      if (list.length>3){ const m=document.createElement('span'); m.className='more'; m.textContent='+'+(list.length-3)+' more'; b.appendChild(m); }
      b.onclick = () => openDay(k, date);
      g.appendChild(b);
    }
  }

  function openDay(k, date){
    selected = k;
    $('sheetTitle').textContent = DOW[date.getDay()]+' '+MONTHS[date.getMonth()]+' '+date.getDate();
    $('sheetSub').textContent = k===todayKey ? 'Today' : '';
    renderSheet();
    $('sheet').classList.add('open'); $('scrim').classList.add('open');
  }
  function closeSheet(){ $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); selected=null; }

  function renderSheet(){
    const list = state.entries[selected] || [];
    const ul = $('lineup'); ul.innerHTML='';
    list.forEach((e,i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="dot" style="background:'+colorFor(e.name)+'"></span><div class="who">'+esc(e.name)+
        ((e.time||e.note)?'<small>'+esc([e.time,e.note].filter(Boolean).join(' · '))+'</small>':'')+'</div>';
      const del = document.createElement('button'); del.className='del'; del.textContent='×'; del.setAttribute('aria-label','Remove '+e.name);
      del.onclick = () => { list.splice(i,1); if(!list.length) delete state.entries[selected]; save(); };
      li.appendChild(del); ul.appendChild(li);
    });
    $('emptyMsg').style.display = list.length ? 'none' : 'block';

    const q = $('quick'); q.innerHTML='';
    state.people.forEach(p => {
      const b = document.createElement('button'); b.style.background=p.color; b.textContent=p.name;
      b.onclick = () => addEntry(p.name, $('timeIn').value.trim(), $('noteIn').value.trim());
      q.appendChild(b);
    });
    if (state.people.length){
      const x = document.createElement('button'); x.className='x'; x.textContent='edit names';
      x.onclick = () => { const n=prompt('Type a name to remove from your quick list:'); if(!n) return;
        state.people = state.people.filter(p => p.name.toLowerCase() !== n.trim().toLowerCase()); save(); };
      q.appendChild(x);
    }
    $('quickLabel').style.display = state.people.length ? 'block' : 'none';
  }

  function addEntry(name, time, note){
    if (!name){ $('nameIn').focus(); return; }
    ensurePerson(name);
    const list = state.entries[selected] = state.entries[selected] || [];
    list.push({ name, time, note });
    list.sort((a,b) => (a.time||'zz').localeCompare(b.time||'zz'));
    save();
    $('nameIn').value=''; $('timeIn').value=''; $('noteIn').value='';
    toast(name+' added');
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1400); }

  $('addBtn').onclick = () => addEntry($('nameIn').value.trim(), $('timeIn').value.trim(), $('noteIn').value.trim());
  $('nameIn').addEventListener('keydown', e => { if(e.key==='Enter') $('addBtn').click(); });
  $('closeBtn').onclick = closeSheet; $('scrim').onclick = closeSheet;
  $('prev').onclick = () => { view.setMonth(view.getMonth()-1); render(); };
  $('next').onclick = () => { view.setMonth(view.getMonth()+1); render(); };
  $('todayBtn').onclick = () => { view=new Date(); view.setDate(1); render(); };

  render(); // draw empty grid immediately while Firebase connects
</script>
</body>
</html>
