<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* CSUF Titans: Titan Blue #00274C, Titan Orange #FF7900 */
    --chalk:#F2F4F7; --grass:#00478F; --grass-dk:#00274C; --dirt:#FF7900;
    --ink:#14202E; --mute:#64707E; --line:#D9DEE6; --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--chalk);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input{font:inherit}

  header{background:var(--grass-dk);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--dirt)}
  .eyebrow{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.8;display:flex;justify-content:space-between;align-items:center}
  .status{font-size:10px;letter-spacing:.05em;text-transform:none;opacity:.85}
  .status.err{color:#FFB199;opacity:1}
  .monthrow{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .month{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
  .nav{display:flex;gap:6px}
  .nav button{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.14);font-size:20px;line-height:1}
  .nav button:active{background:rgba(255,255,255,.28)}
  .today-btn{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:0 10px;width:auto!important}

  .banner{display:none;background:#8A3A2C;color:#fff;font-size:13px;line-height:1.4;padding:10px 16px}
  .banner.show{display:block}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px 6px 120px}
  .dow{text-align:center;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:4px 0 6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:82px;padding:4px 3px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
  .day.pad{background:transparent;border-color:transparent}
  .day:active{background:#EAF0F8}
  .day .num{font-family:Oswald,sans-serif;font-size:13px;font-weight:500;color:var(--mute);line-height:1}
  .day.today .num{color:#fff;background:var(--dirt);border-radius:999px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  .day.has{border-color:var(--grass)}
  .chip{font-size:10px;font-weight:600;line-height:1.15;padding:2px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{font-size:10px;color:var(--mute);font-weight:600}
  .day.weekend{background:#F6F8FB}

  .scrim{position:fixed;inset:0;background:rgba(0,23,45,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:10;max-height:85vh}
  .sheet.open{transform:translateY(0)}
  .handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 6px}
  .sheet-head{padding:4px 18px 10px;border-bottom:2px solid var(--dirt);display:flex;align-items:baseline;justify-content:space-between}
  .sheet-title{font-family:Oswald,sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;color:var(--grass-dk)}
  .sheet-sub{font-size:12px;color:var(--mute)}
  .close{font-size:22px;color:var(--mute);padding:4px 6px}
  .sheet-body{overflow:auto;padding:12px 18px 24px}

  .lineup{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .lineup li{display:flex;align-items:center;gap:10px;background:var(--chalk);border-radius:8px;padding:9px 10px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .lineup .who{font-weight:600;flex:1;min-width:0}
  .lineup .who small{display:block;font-weight:400;color:var(--mute);font-size:12px}
  .del{color:var(--mute);font-size:20px;padding:0 4px;line-height:1}
  .empty{color:var(--mute);font-size:14px;padding:6px 0 14px}

  .label{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 6px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .quick button{padding:7px 12px;border-radius:999px;color:#fff;font-weight:600;font-size:13px}
  .quick button:active{filter:brightness(.85)}
  .quick .x{background:none;color:var(--mute);font-weight:500;padding:7px 4px;font-size:12px}

  .form{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:stretch}
  .form input{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;font-size:15px;min-width:0}
  .form input:focus{outline:2px solid var(--grass);outline-offset:0;border-color:var(--grass)}
  .form input[aria-invalid="true"]{border-color:#F3B8A8;outline-color:#F3B8A8}
  .form .note{grid-column:1 / -1}
  .add{grid-column:1 / -1;background:var(--grass);color:#fff;border-radius:8px;padding:12px;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:15px;font-weight:700}
  .add:active{background:var(--grass-dk)}
  .add[disabled]{opacity:.5;cursor:default}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--grass-dk);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;z-index:11}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="eyebrow">
    <span>Who's on the field</span>
    <span class="status" id="status">connecting…</span>
  </div>
  <div class="monthrow">
    <div class="month" id="monthLabel">—</div>
    <div class="nav">
      <button class="today-btn" id="todayBtn">Today</button>
      <button id="prev" aria-label="Previous month">‹</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
  </div>
</header>
<div class="banner" id="banner"></div>

<div class="grid" id="grid"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="handle"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="sheetTitle">—</div>
      <div class="sheet-sub" id="sheetSub"></div>
    </div>
    <button class="close" id="closeBtn" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body">
    <div class="label">On the field</div>
    <ul class="lineup" id="lineup"></ul>
    <div class="empty" id="emptyMsg">Nobody scheduled yet. Tap a name below or add someone.</div>

    <div class="label" id="quickLabel">Tap to add</div>
    <div class="quick" id="quick"></div>

    <div class="form">
      <input id="nameIn" placeholder="Name" autocomplete="off" autocapitalize="words">
      <input id="timeIn" placeholder="Time — e.g. 3:30pm" autocomplete="off">
      <input id="noteIn" class="note" placeholder="Note (optional) — e.g. hitting clinic, cage 2" autocomplete="off">
      <button class="add" id="addBtn">Add to this day</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- =========================== FIREBASE SETUP ===========================
1. https://console.firebase.google.com → create a free project.
2. Add a Web app (</> icon) → copy the firebaseConfig values into
   CONFIG.firebase below.
3. Build → Realtime Database → Create Database (any region, test mode is
   fine to start — but then do step 4, because TEST MODE EXPIRES IN ~30
   DAYS and the calendar will stop saving).
4. Realtime Database → Rules tab → replace everything with:

   {
     "rules": {
       ".read": false,
       ".write": false,
       "field-schedule": {
         ".read": true,
         ".write": true,
         "entries": {
           "$day": {
             ".validate": "$day.matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/)"
           }
         }
       }
     }
   }

   These rules never expire. Only the field-schedule branch is open;
   the rest of the database stays locked. Anyone who has the page URL
   can view and edit the schedule, so share the link only with your
   instructors and keep client phone numbers / personal info out of
   the notes.
====================================================================== -->
<script type="module">
  /* ---------- CONFIGURATION ---------- */

  const CONFIG = {
    /* Chip colors — first two are Titan Blue and Titan Orange, rest chosen to stay legible with white text */
    colors: ['#00478F','#E56A00','#00274C','#8A3B6B','#2A8C8C','#5C6B2E','#A33A3A','#6B4E9B','#B8860B','#3B5BA5'],
    months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    daysOfWeek: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    validation: {
      nameMaxLength: 100,
      timeMaxLength: 20,
      noteMaxLength: 200
    },
    firebase: {
      apiKey: "AIzaSyBfp251mIc03Ah6jWNXh7V8Kn5kt4HbkTQ",
      authDomain: "csuf-field-schedule.firebaseapp.com",
      databaseURL: "https://csuf-field-schedule-default-rtdb.firebaseio.com",
      projectId: "csuf-field-schedule",
      storageBucket: "csuf-field-schedule.firebasestorage.app",
      messagingSenderId: "440922836237",
      appId: "1:440922836237:web:fb4e32c96f265a80a5b444"
    }
  };

  /* ---------- LOGGING ---------- */

  const log = (level, msg, data) => {
    const timestamp = new Date().toISOString();
    const prefix = `[${timestamp}] ${level.toUpperCase()}`;
    console.log(`${prefix}: ${msg}`, data || '');
  };

  /* ---------- UI HELPERS ---------- */

  const $ = id => document.getElementById(id);
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let toastTimeout;
  const setStatus = (text, isErr) => { const s=$('status'); s.textContent=text; s.classList.toggle('err', !!isErr); };
  const showBanner = msg => { const b=$('banner'); b.textContent=msg; b.classList.add('show'); };
  const hideBanner = () => $('banner').classList.remove('show');
  const toast = m => {
    const t=$('toast');
    t.textContent=m;
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout=setTimeout(()=>t.classList.remove('show'),1600);
  };

  /* ---------- TIME FORMATTING ----------
     Everything typed into the Time box is normalized to "H:MM AM/PM".
     Accepted: "3", "3pm", "3:30", "3:30 pm", "15:00", "12a", "12.30pm".
     Bare numbers with no am/pm are guessed: 1–7 → PM, 8–11 → AM, 12 → PM
     (lesson hours). Typing am/pm always wins over the guess.
     Unrecognized text (e.g. "after practice") is kept as typed. */

  function formatTime(raw){
    if (!raw) return '';
    const s = String(raw).trim().toLowerCase().replace(/\./g, ':').replace(/\s+/g, '');
    const m = s.match(/^(\d{1,2})(?::(\d{2}))?(a|am|p|pm)?$/);
    if (!m) return String(raw).trim();
    let h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    let ap = m[3] ? (m[3][0] === 'p' ? 'PM' : 'AM') : null;
    if (min > 59 || h > 23) return String(raw).trim();
    if (ap === null) {
      if (h === 0) { h = 12; ap = 'AM'; }
      else if (h > 12) { h -= 12; ap = 'PM'; }          // 24-hour input like 15:00
      else if (h === 12) { ap = 'PM'; }
      else if (h >= 8 && h <= 11) { ap = 'AM'; }        // morning lessons
      else { ap = 'PM'; }                                // 1–7 → afternoon/evening
    } else {
      if (h === 0) h = 12;
      if (h > 12) return String(raw).trim();            // "15pm" makes no sense
    }
    return h + ':' + String(min).padStart(2, '0') + ' ' + ap;
  }

  /* Minutes since midnight, for sorting. Untimed entries sort last;
     unparseable text sorts just before them. */
  function timeMinutes(t){
    if (!t) return 1e5;
    const m = String(t).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
    if (!m) return 1e5 - 1;
    let h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    const ap = m[3] ? m[3].toLowerCase() : null;
    if (ap === 'pm' && h !== 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return h * 60 + min;
  }
  const byTime = (a, b) => timeMinutes(a.time) - timeMinutes(b.time);

  /* ---------- STATE ---------- */

  let state = { entries: {}, people: [] };
  let uiState = {
    selected: null,
    selectedDate: null,
    view: (() => { const d = new Date(); d.setDate(1); return d; })(),
    dayElementCache: new Map()
  };
  let canSave = false;
  let todayKey = iso(new Date());

  /* ---------- DATA VALIDATION ---------- */

  function validateEntry(name, time, note) {
    if (!name || name.length === 0) return 'Name is required';
    if (name.length > CONFIG.validation.nameMaxLength) return `Name must be ${CONFIG.validation.nameMaxLength} characters or less`;
    if (time && time.length > CONFIG.validation.timeMaxLength) return `Time must be ${CONFIG.validation.timeMaxLength} characters or less`;
    if (note && note.length > CONFIG.validation.noteMaxLength) return `Note must be ${CONFIG.validation.noteMaxLength} characters or less`;
    return null;
  }

  /* ---------- FIREBASE UTILITIES ---------- */

  const asArray = v => v == null ? [] : (Array.isArray(v) ? v.filter(Boolean) : Object.values(v).filter(Boolean));
  function normalize(raw){
    const out = { entries: {}, people: asArray(raw && raw.people) };
    const entries = (raw && raw.entries) || {};
    for (const k of Object.keys(entries)) {
      const list = asArray(entries[k]);
      if (list.length) out.entries[k] = list;
    }
    return out;
  }

  function colorFor(name){
    const p = state.people.find(p => p.name.toLowerCase() === name.toLowerCase());
    return p ? p.color : CONFIG.colors[state.people.length % CONFIG.colors.length];
  }

  /* ---------- RENDERING HELPERS ---------- */

  function createDayElement(d, date, k, list) {
    const b = document.createElement('button');
    b.className = 'day'+(k===todayKey?' today':'')+(list.length?' has':'')+((date.getDay()===0||date.getDay()===6)?' weekend':'');
    b.setAttribute('aria-label', CONFIG.months[date.getMonth()]+' '+d);
    b.innerHTML = '<span class="num">'+d+'</span>';

    list.slice(0,3).forEach(e => {
      const c=document.createElement('span');
      c.className='chip';
      c.style.background=colorFor(e.name);
      c.textContent=(e.time?e.time+' ':'')+e.name.split(' ')[0];
      b.appendChild(c);
    });

    if (list.length>3){
      const m=document.createElement('span');
      m.className='more';
      m.textContent='+'+(list.length-3)+' more';
      b.appendChild(m);
    }

    b.onclick = () => openDay(k, date);
    return b;
  }

  function render(){
    todayKey = iso(new Date());
    $('monthLabel').textContent = CONFIG.months[uiState.view.getMonth()]+' '+uiState.view.getFullYear();
    const g = $('grid');
    g.innerHTML = '';

    CONFIG.daysOfWeek.forEach(d => {
      const el=document.createElement('div');
      el.className='dow';
      el.textContent=d;
      g.appendChild(el);
    });

    const first = new Date(uiState.view.getFullYear(), uiState.view.getMonth(), 1);
    const days = new Date(uiState.view.getFullYear(), uiState.view.getMonth()+1, 0).getDate();

    for (let i=0;i<first.getDay();i++){
      const p=document.createElement('div');
      p.className='day pad';
      g.appendChild(p);
    }

    for (let d=1; d<=days; d++){
      const date = new Date(uiState.view.getFullYear(), uiState.view.getMonth(), d);
      const k = iso(date);
      const list = (state.entries[k] || []).slice().sort(byTime);
      const dayEl = createDayElement(d, date, k, list);
      uiState.dayElementCache.set(k, dayEl);
      g.appendChild(dayEl);
    }
  }

  function openDay(k, date){
    uiState.selected = k;
    uiState.selectedDate = date;
    $('sheetTitle').textContent = CONFIG.daysOfWeek[date.getDay()]+' '+CONFIG.months[date.getMonth()]+' '+date.getDate();
    $('sheetSub').textContent = k===todayKey ? 'Today' : '';
    renderSheet();
    $('sheet').classList.add('open');
    $('scrim').classList.add('open');
  }

  function closeSheet(){
    $('sheet').classList.remove('open');
    $('scrim').classList.remove('open');
    uiState.selected=null;
    uiState.selectedDate=null;
  }

  function renderSheet(){
    const list = (state.entries[uiState.selected] || []).slice().sort(byTime);
    const ul = $('lineup');
    ul.innerHTML='';

    list.forEach((e) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="dot" style="background:'+colorFor(e.name)+'"></span><div class="who">'+esc(e.name)+
        ((e.time||e.note)?'<small>'+esc([e.time,e.note].filter(Boolean).join(' · '))+'</small>':'')+'</div>';
      const del = document.createElement('button');
      del.className='del';
      del.textContent='×';
      del.setAttribute('aria-label','Remove '+e.name);
      del.onclick = () => removeEntry(uiState.selected, e);
      li.appendChild(del);
      ul.appendChild(li);
    });

    $('emptyMsg').style.display = list.length ? 'none' : 'block';

    const q = $('quick');
    q.innerHTML='';
    state.people.forEach(p => {
      const b=document.createElement('button');
      b.style.background=p.color;
      b.textContent=p.name;
      b.onclick = () => addEntry(p.name, $('timeIn').value.trim(), $('noteIn').value.trim());
      q.appendChild(b);
    });

    if (state.people.length){
      const x=document.createElement('button');
      x.className='x';
      x.textContent='edit names';
      x.onclick = () => {
        const n=prompt('Type a name to remove from your quick list:');
        if(!n) return;
        removePerson(n.trim());
      };
      q.appendChild(x);
    }
    $('quickLabel').style.display = state.people.length ? 'block' : 'none';
  }

  render();

  /* ---------- DATE ROLLOVER ----------
     The calendar always opens on the real current month (uiState.view
     starts from new Date()). This handler covers tabs that stay open:
     when the date changes, the "today" ring moves, and — if you were
     looking at the month that just ended — the view follows into the
     new month automatically. If you had navigated somewhere else (say,
     planning next month), it leaves your view alone. */

  function handleDateRollover(){
    const now = new Date();
    if (iso(now) === todayKey) return;
    const oldYear = parseInt(todayKey.slice(0,4), 10);
    const oldMonth = parseInt(todayKey.slice(5,7), 10) - 1;
    const wasViewingCurrentMonth =
      uiState.view.getFullYear() === oldYear && uiState.view.getMonth() === oldMonth;
    if (wasViewingCurrentMonth &&
        (now.getMonth() !== oldMonth || now.getFullYear() !== oldYear)) {
      uiState.view = new Date(now.getFullYear(), now.getMonth(), 1);
      log('info', 'Month rolled over, following to new month');
    }
    render();
  }

  setInterval(handleDateRollover, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) handleDateRollover(); });
  window.addEventListener('focus', handleDateRollover);

  /* ---------- FIREBASE ---------- */

  let dayRef = null, peopleRef = null, runTransaction = null;

  if (Object.values(CONFIG.firebase).some(v => typeof v === 'string' && (v.startsWith('VITE_') || v.startsWith('YOUR_')))) {
    setStatus('not configured', true);
    showBanner('Firebase config is missing — the calendar will display but nothing will save. Update CONFIG.firebase.');
    log('error', 'Firebase config incomplete');
  } else {
    initFirebase();
  }

  async function initFirebase(){
    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
      const dbMod  = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js");
      runTransaction = dbMod.runTransaction;

      const app = appMod.initializeApp(CONFIG.firebase);
      const db  = dbMod.getDatabase(app);
      dayRef    = k => dbMod.ref(db, 'field-schedule/entries/' + k);
      peopleRef = dbMod.ref(db, 'field-schedule/people');

      dbMod.onValue(dbMod.ref(db, 'field-schedule'), snap => {
        state = normalize(snap.val());
        hideBanner();
        canSave = true;
        render();
        if (uiState.selected) renderSheet();
        setStatus('synced');
        log('info', 'Synced with Firebase');
      }, err => {
        log('error', 'Firebase sync error', err);
        canSave = false;
        if (err && String(err.message||err).toLowerCase().includes('permission')) {
          setStatus('blocked', true);
          showBanner('The database refused the connection (permission denied). Update Firebase rules from the setup comment.');
        } else {
          setStatus('offline — retrying', true);
        }
      });

      dbMod.onValue(dbMod.ref(db, '.info/connected'), snap => {
        if (snap.val() === true) { setStatus('synced'); }
        else if (canSave) { setStatus('offline — changes will sync when back', true); }
      });
    } catch (e) {
      log('error', 'Firebase initialization failed', e);
      setStatus('setup error', true);
      showBanner('Could not load Firebase — check config and connection, then refresh.');
    }
  }

  /* ---------- DATA OPERATIONS ---------- */

  function guardSave(){
    if (!canSave){
      toast('Not connected — change not saved');
      return false;
    }
    return true;
  }

  function addEntry(name, time, note){
    const nameEl = $('nameIn');
    time = formatTime(time);                 // normalize to "H:MM AM/PM" before anything else
    const error = validateEntry(name, time, note);

    if (error) {
      nameEl.setAttribute('aria-invalid', 'true');
      nameEl.focus();
      toast(error);
      log('warn', 'Validation failed', { name, time, note, error });
      return;
    }
    nameEl.removeAttribute('aria-invalid');

    if (!uiState.selected || !guardSave()) return;

    const entry = { name, time: time||'', note: note||'' };

    // Optimistic update
    if (!state.entries[uiState.selected]) state.entries[uiState.selected] = [];
    state.entries[uiState.selected].push(entry);
    renderSheet();

    ensurePerson(name);
    runTransaction(dayRef(uiState.selected), current => {
      const list = asArray(current);
      list.push(entry);
      list.sort(byTime);
      return list;
    }).then(() => {
      $('nameIn').value='';
      $('timeIn').value='';
      $('noteIn').value='';
      toast(name+' added'+(entry.time?' · '+entry.time:''));
      log('info', 'Entry added', { name, date: uiState.selected });
    }).catch(e => {
      log('error', 'Failed to add entry', { name, error: e });
      // Revert optimistic update
      if (state.entries[uiState.selected]) {
        state.entries[uiState.selected] = state.entries[uiState.selected].filter(x => !(x.name === entry.name && x.time === entry.time && x.note === entry.note));
        if (!state.entries[uiState.selected].length) delete state.entries[uiState.selected];
        renderSheet();
      }
      toast('Could not save — try again');
    });
  }

  function removeEntry(k, entry){
    if (!guardSave()) return;

    // Optimistic update
    if (state.entries[k]) {
      state.entries[k] = state.entries[k].filter(x =>
        !(x.name===entry.name && (x.time||'')===(entry.time||'') && (x.note||'')===(entry.note||'')));
      if (!state.entries[k].length) delete state.entries[k];
      renderSheet();
    }

    runTransaction(dayRef(k), current => {
      const list = asArray(current).filter(x =>
        !(x.name===entry.name && (x.time||'')===(entry.time||'') && (x.note||'')===(entry.note||'')));
      return list.length ? list : null;
    }).catch(e => {
      log('error', 'Failed to remove entry', { key: k, error: e });
      toast('Could not remove — try again');
      renderSheet();
    });
  }

  function ensurePerson(name){
    if (state.people.some(p => p.name.toLowerCase() === name.toLowerCase())) return;
    runTransaction(peopleRef, current => {
      const list = asArray(current);
      if (list.some(p => p.name.toLowerCase() === name.toLowerCase())) return list;
      list.push({ name, color: CONFIG.colors[list.length % CONFIG.colors.length] });
      log('info', 'Person added to quick list', { name });
      return list;
    }).catch(e => log('error', 'Failed to add person to quick list', { name, error: e }));
  }

  function removePerson(name){
    if (!guardSave()) return;
    runTransaction(peopleRef, current => {
      const list = asArray(current).filter(p => p.name.toLowerCase() !== name.toLowerCase());
      log('info', 'Person removed from quick list', { name });
      return list.length ? list : null;
    }).catch(e => log('error', 'Failed to remove person', { name, error: e }));
  }

  /* ---------- EVENT WIRING ---------- */

  $('addBtn').onclick = () => addEntry($('nameIn').value.trim(), $('timeIn').value.trim(), $('noteIn').value.trim());
  $('nameIn').addEventListener('keydown', e => { if(e.key==='Enter') $('addBtn').click(); });
  $('closeBtn').onclick = closeSheet;
  $('scrim').onclick = closeSheet;
  $('prev').onclick = () => { uiState.view.setMonth(uiState.view.getMonth()-1); render(); };
  $('next').onclick = () => { uiState.view.setMonth(uiState.view.getMonth()+1); render(); };
  $('todayBtn').onclick = () => { uiState.view=new Date(); uiState.view.setDate(1); render(); };
</script>
</body>
</html>
